<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ballast — Ollama Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%237c5cff'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M16 6v20M6 16h20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>Ballast</h1>
        <p class="tagline">Control de modelos locales</p>
      </div>
    </div>
    <div class="status" id="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Conectando con Ollama…</span>
    </div>
  </header>

  <main>
    <section class="cards">
      <article class="card">
        <p class="card-label">Modelos instalados</p>
        <p class="card-value" id="stat-models">—</p>
      </article>
      <article class="card">
        <p class="card-label">En VRAM</p>
        <p class="card-value" id="stat-loaded">—</p>
      </article>
      <article class="card">
        <p class="card-label">VRAM ocupada</p>
        <p class="card-value" id="stat-vram">—</p>
      </article>
      <article class="card">
        <p class="card-label">Total modelos</p>
        <p class="card-value" id="stat-total">—</p>
      </article>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Modelos</h2>
        <span class="hint" id="refresh-hint">Actualizando cada 5 s</span>
      </div>
      <div class="table-wrap">
        <table id="models">
          <thead>
            <tr>
              <th>Modelo</th>
              <th>Tamaño</th>
              <th>Quant</th>
              <th>Contexto</th>
              <th>Capacidades</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="models-body">
            <tr><td colspan="7" class="empty">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <p class="footnote">
      Ballast no guarda prompts ni respuestas. Solo metadatos y contadores.
    </p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
